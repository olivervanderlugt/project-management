name: Dashboard

# Rebuilds the dashboard from the markdown and publishes it to GitHub Pages on
# every push. Nothing runs locally, so the board stays live with your laptop shut.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main, "claude/**"]
    # Only what the board is made of. A push that touches scripts or agent
    # definitions does not change a pixel, and triggering a run for it just
    # cancels the one already waiting for a runner.
    paths:
      - "planning/**"
      - "projects/**"
      - "ideas/**"
      - "decisions/**"
      - "reference/**"
      - "tasks/**"
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, but never kill one that is already running: a deploy
# that gets cancelled halfway leaves the site on its previous version, and the
# autosave hook pushes often enough that that kept happening.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the board
        run: python3 dashboard/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
