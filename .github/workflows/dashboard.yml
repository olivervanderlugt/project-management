name: Dashboard

# Rebuilds the dashboard from the markdown and publishes it to GitHub Pages on
# every push. Nothing runs locally, so the board stays live with your laptop shut.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    # Every branch, every push. There used to be a `paths:` filter here on the
    # theory that only content changes a pixel; that was wrong — the board also
    # renders agent and model names out of scripts/dispatch.py and routing.yml —
    # and a board that silently skips a rebuild is worse than one that rebuilds
    # for nothing. A run costs seconds.
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, but never kill one that is already running: a deploy
# that gets cancelled halfway leaves the site on its previous version, and the
# autosave hook pushes often enough that that kept happening.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the board
        run: python3 dashboard/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  # If this job is skipped or fails in about a second without ever picking up a
  # runner, it was refused before it started: the `github-pages` environment
  # only accepts deployments from the branches named in its deployment-branch
  # policy. Settings -> Environments -> github-pages -> Deployment branches.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A green deploy is not proof the board changed. This fetches the live page
  # and looks for the commit it was built from, so a stale site is a red run
  # instead of something you notice days later.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: The live board must be this commit
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          url="${PAGE_URL:-https://olivervanderlugt.github.io/project-management/}"
          want="${GITHUB_SHA:0:7}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$url" | grep -q "hangar-commit\" content=\"$want\""; then
              echo "$url is serving $want"
              exit 0
            fi
            echo "attempt $attempt: $url is not serving $want yet"
            sleep 10
          done
          echo "::error::$url did not serve $want within a minute — the board is stale"
          exit 1
